# nginx in front of the Node app (port 3000). The app already sends brotli/gzip and cache headers,
# so nginx only proxies; with Cloudflare in front, the edge caches /img, /c and /api/flix.
upstream lingoup {
  server 127.0.0.1:3000;
  keepalive 32;
}
server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;

  gzip off;                 # responses come compressed from the app
  client_max_body_size 1m;

  location / {
    proxy_pass http://lingoup;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
  }
}

<!doctype html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17182b">
<title>LingoUp</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://telegram.org">
<!-- the SDK loads in parallel and never blocks the first screen; the app starts without it -->
<script async src="https://telegram.org/js/telegram-web-app.js?59" onload="window.__tgl&&__tgl()"></script>
<style>/*CSS*/</style>
</head>
<body>
<div id="app">
  <!-- skeleton: painted before any script runs, replaced by the real screen -->
  <header class="top"><span class="sk" style="width:128px;height:30px"></span><span class="sk" style="width:30px;height:30px;border-radius:99px"></span></header>
  <main><span class="sk" style="width:46%;height:16px"></span>
    <div class="stats"><div class="stat sk" style="height:66px"></div><div class="stat sk" style="height:66px"></div><div class="stat sk" style="height:66px"></div></div>
    <span class="sk" style="width:30%;height:18px;margin:24px 0 12px"></span>
    <div class="grid"><div class="fc sk"></div><div class="fc sk"></div><div class="fc sk"></div><div class="fc sk"></div></div></main>
</div>
<div id="toast" hidden></div>
<script>/*CORE*/</script>
</body>
</html>
